name: Render boundaries MP4
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: boundaries-full-mp4
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Inspect runner and install tested dependencies
        run: |
          set -euo pipefail
          nproc
          free -m
          ffmpeg -version | head -1
          python -m pip install -r requirements.txt
      - name: Validate inputs and record the exact build
        run: |
          set -euo pipefail
          bash source/restore_audio.sh
          python source/audit.py
          python source/build_manifest.py
      - name: Render full captioned episode
        run: |
          set -euo pipefail
          python source/render.py --out delivery/episode-v2-review.mp4 2>&1 | tee qa/render.log
      - name: Validate encoded MP4 and extract inspection frames
        run: |
          set -euo pipefail
          python source/qa_master.py delivery/episode-v2-review.mp4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boundaries-mp4-${{ github.run_id }}
          retention-days: 14
          compression-level: 0
          path: |
            delivery/episode-v2-review.mp4
            delivery/build-manifest.json
            delivery/captions.srt
            delivery/seo.md
            delivery/credits-licenses.md
            delivery/panel_sync_review.md
            qa/encoded-*
            qa/master_technical.json
            qa/structural_audit.json
            qa/render.log
